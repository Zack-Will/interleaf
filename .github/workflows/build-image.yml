# Builds the two images a deployment needs and pushes them to the GitHub
# Container Registry, so that a small host can deploy with a plain `docker pull`
# instead of compiling TeX Live and Java locally:
#
#   interleaf   Overleaf Community Edition plus this fork's modules
#   git-bridge  the MIT-licensed Java bridge from services/git-bridge
#
# The Overleaf Toolkit insists on a version-shaped tag (`X.Y.Z`) and derives the
# git-bridge tag from the same string, so both images carry the same tag.
name: Build Interleaf images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag, must look like X.Y.Z for the Overleaf Toolkit'
        required: true
        default: '6.2.0'
      base_image:
        description: 'Published Overleaf base image to build on'
        required: true
        default: 'sharelatex/sharelatex-base:6.1.0'
      texlive_scheme:
        description: 'Extra TeX Live to install, e.g. scheme-full. Empty keeps the base scheme-basic'
        required: false
        default: 'scheme-full'
      texlive_mirror:
        description: 'TeX Live repository, must serve the same release as the base image'
        required: false
        default: 'https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2025/tlnet-final'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag shape the toolkit requires
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "version must be X.Y.Z"; exit 1; }

      # The image carries TeX Live and a full node_modules tree; the hosted
      # runner needs the space the preinstalled toolchains occupy.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # Container repository names must be lowercase, and a GitHub account name
      # need not be.
      - name: Resolve the registry namespace
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `server-ce/Dockerfile` is built from the monorepo root, and the Makefile
      # copies this ignore file there before building.
      - name: Stage the build context
        run: cp server-ce/.dockerignore .dockerignore

      - name: Build and push the Interleaf image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile
          push: true
          build-args: |
            OVERLEAF_BASE_TAG=${{ inputs.base_image }}
            TEXLIVE_SCHEME=${{ inputs.texlive_scheme }}
            TEXLIVE_MIRROR=${{ inputs.texlive_mirror }}
          labels: |
            com.overleaf.ce.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/interleaf:${{ inputs.version }}
            ghcr.io/${{ env.OWNER }}/interleaf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built from the MIT-licensed source in this repository rather than
      # republishing someone else's binary. Its build context is the service
      # directory, not the monorepo root.
      - name: Build and push the git-bridge image
        uses: docker/build-push-action@v6
        with:
          context: services/git-bridge
          file: services/git-bridge/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/${{ env.OWNER }}/git-bridge:${{ inputs.version }}
          cache-from: type=gha,scope=git-bridge
          cache-to: type=gha,mode=max,scope=git-bridge
